# Mount copies of the NV/calibration partitions instead of the real ones.
# Ubuntu Touch has no SELinux, so files ccci_fsd/nvram create on the real
# nvdata/nvcfg/persist/protect* would be unlabeled for HyperOS later.
# mount-android-partitions prefers /userdata/<label>.img when it exists.
# (Same approach as volla-ansuz.)
[Service]
ExecStartPre=-/bin/sh -c 'for p in nvcfg nvdata persist protect1 protect2; do [ -f /userdata/$p.img ] || cp /dev/disk/by-partlabel/$p /userdata/$p.img; done'
